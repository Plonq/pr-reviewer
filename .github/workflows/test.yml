name: Tests

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: bash scripts/fetch-sparkle.sh
      - run: cargo check -p gander --features auto-updates --locked
