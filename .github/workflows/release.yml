name: Release DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dmg
  cancel-in-progress: true

jobs:
  dmg:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Create app bundle
        run: bash scripts/bundle-macos.sh

      - name: Create unnotarised DMG
        run: |
          # Apple Silicon requires a signature, but ad-hoc signing is free
          # and does not provide Developer ID trust or notarisation.
          codesign --force --sign - dist/Gander.app
          codesign --verify --deep --strict --verbose=2 dist/Gander.app
          hdiutil create -volname Gander -srcfolder dist -ov -format UDZO Gander.dmg
          shasum -a 256 Gander.dmg > Gander.dmg.sha256

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin "HEAD:refs/tags/latest"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Latest build" --notes ""
          gh release edit latest --notes "Unnotarised Apple Silicon build from \`${GITHUB_SHA::7}\`. Requires macOS 15 or later. If macOS blocks the installed app, attempt to open it, then allow it in System Settings → Privacy & Security → Open Anyway."
          gh release upload latest Gander.dmg Gander.dmg.sha256 --clobber
