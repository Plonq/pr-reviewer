name: Release DMG

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-dmg
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Create app bundle
        run: |
          APP=dist/Gander.app
          mkdir -p "$APP/Contents/MacOS"
          # The explicit aarch64-apple-darwin build target (see .cargo/config.toml)
          # puts artifacts under target/<triple>/release/.
          cp target/aarch64-apple-darwin/release/gander "$APP/Contents/MacOS/gander"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Gander</string>
            <key>CFBundleDisplayName</key>
            <string>Gander</string>
            <key>CFBundleIdentifier</key>
            <string>org.plonq.gander</string>
            <key>CFBundleExecutable</key>
            <string>gander</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_SHA::7}</string>
            <key>LSMinimumSystemVersion</key>
            <string>15.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        run: |
          ln -s /Applications dist/Applications
          hdiutil create -volname Gander -srcfolder dist -ov -format UDZO Gander.dmg

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin "HEAD:refs/tags/latest"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Latest build" --notes ""
          gh release edit latest --notes "Automated build from \`${GITHUB_SHA::7}\`"
          gh release upload latest Gander.dmg --clobber
