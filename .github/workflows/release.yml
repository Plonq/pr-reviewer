name: Release DMG

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-dmg
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  dmg:
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH (for example v0.2.0).'
            exit 1
          fi
          printf 'GANDER_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Fetch Sparkle
        run: bash scripts/fetch-sparkle.sh

      - name: Check update signing configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PUBLIC_KEY" || { echo 'Set the SPARKLE_PUBLIC_KEY repository variable (see docs/releases.md)'; exit 1; }
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Set the SPARKLE_PRIVATE_KEY repository secret (see docs/releases.md)'; exit 1; }

      - name: Build
        run: cargo build --release --locked --features auto-updates

      - name: Create app bundle
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash scripts/bundle-macos.sh

      - name: Create unnotarised DMG
        run: |
          # Apple Silicon requires a signature, but ad-hoc signing is free
          # and does not provide Developer ID trust or notarisation.
          codesign --force --sign - dist/Gander.app
          codesign --verify --deep --strict --verbose=2 dist/Gander.app
          hdiutil create -volname Gander -srcfolder dist -ov -format UDZO Gander.dmg
          shasum -a 256 Gander.dmg > Gander.dmg.sha256

      - name: Sign update and create feed
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/create-appcast.py Gander.dmg \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT/Gander.dmg" \
            dist/Gander.app/Contents/Info.plist target/sparkle/bin/sign_update appcast.xml

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Gander.dmg Gander.dmg.sha256 --clobber
          else
            previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
              --json tagName --jq '.[0].tagName // empty')
            if [[ -z "$previous" ]]; then
              # The first named release follows the last rolling build. Never
              # use the movable latest tag in release-note comparison links.
              previous=$(gh release list --exclude-drafts --limit 100 --json tagName \
                --jq 'map(select(.tagName | startswith("build-"))) | .[0].tagName // empty')
            fi
            notes=()
            if [[ -n "$previous" ]]; then
              notes=(--notes-start-tag "$previous")
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Gander $GANDER_VERSION" --generate-notes "${notes[@]}" \
              Gander.dmg Gander.dmg.sha256
          fi

      - name: Publish immutable update archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" \
            --target "$GITHUB_SHA" --prerelease --title "Build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            --notes "Automatic update archive for Gander. Ad-hoc signed, not notarised." \
            Gander.dmg Gander.dmg.sha256

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$newest" != "$RELEASE_TAG" ]]; then
            echo "A newer release is published; leaving latest downloads and the update feed unchanged."
            exit 0
          fi
          git push --force origin "HEAD:refs/tags/latest"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Latest release downloads" --notes ""
          gh release edit latest --title "Latest release downloads" --notes "Downloads for [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG). Requires Apple Silicon and macOS 15 or later. Unnotarised: if macOS blocks the installed app, attempt to open it, then allow it in System Settings → Privacy & Security → Open Anyway."
          gh release upload latest Gander.dmg Gander.dmg.sha256 --clobber
          # Publish the feed last: every URL in it is already downloadable.
          gh release upload latest appcast.xml --clobber
