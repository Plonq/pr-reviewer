[package]
name = "gander"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gander"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
diff-core = { path = "../diff-core" }
git = { path = "../git" }
github = { path = "../github" }
store = { path = "../store" }
syntax = { path = "../syntax" }
gpui = "0.2"
# The conversation pane's markdown (gpui-component's TextView) renders
# the PR description; the tree-sitter-languages feature registers the
# grammars its code-block highlighter needs, the same set the diff's syntax
# crate already builds against.
gpui-component = { version = "0.5", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5"
# Must match gpui-component's lsp-types so its CompletionProvider signatures line up.
lsp-types = "0.97"
fuzzy-matcher = "0.3"
# GitHub's emoji shortcode table (gemoji), for the conversation pane's
# `:rocket:` → 🚀 pipe.
emojis = "0.9"
# Use the same GFM AST as TextView for our width-safe block/list layout.
markdown = "1"
http_client = { version = "0.2", package = "gpui_http_client" }
futures = "0.3"
ureq = "2"
sha2 = { workspace = true }
tempfile = "3"
html5ever = "0.27"
image = { version = "0.25", default-features = false }
serde_json = { workspace = true }
libc = "0.2"

[dev-dependencies]
# TestAppContext + the #[gpui::test] harness — app-level behavior tests
# drive the real window/handler chain against a fake facade.
gpui = { version = "0.2", features = ["test-support"] }
