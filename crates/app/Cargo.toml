[package]
name = "gander"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gander"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
diff-core = { path = "../diff-core" }
git = { path = "../git" }
github = { path = "../github" }
store = { path = "../store" }
syntax = { path = "../syntax" }
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
# Must match gpui-component's lsp-types so its CompletionProvider signatures line up.
lsp-types = "0.97"
fuzzy-matcher = "0.3"
http_client = { version = "0.2", package = "gpui_http_client" }
futures = "0.3"
ureq = "2"
serde_json = { workspace = true }
libc = "0.2"

[dev-dependencies]
# TestAppContext + the #[gpui::test] harness — app-level behavior tests
# drive the real window/handler chain against a fake facade.
gpui = { version = "0.2", features = ["test-support"] }