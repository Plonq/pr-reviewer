[package]
name = "gander"
version = "0.1.0"
edition = "2021"

[features]
# Release bundles embed Sparkle; ordinary cargo run/test stays self-contained.
auto-updates = []

[[bin]]
name = "gander"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
diff-core = { path = "../diff-core" }
git = { path = "../git" }
github = { path = "../github" }
store = { path = "../store" }
syntax = { path = "../syntax" }
# Kit's facade supplies the exactly matched gpui-pre 0.3.10 platform family,
# including font-kit and runtime Metal shader compilation. Keep the alias for
# GPUI's proc-macro output; all components/assets use this same facade.
gpui = { package = "gpui-kit", version = "=0.8.1", features = ["tree-sitter-languages"] }
# Pin the facade's semver component/base/assets edges to this researched stack.
gpui-base = "=0.8.1"
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"
lsp-types = "=0.97.0"
fuzzy-matcher = "0.3"
unicode-segmentation = "1"
# GitHub's emoji shortcode table (gemoji), for the conversation pane's
# `:rocket:` → 🚀 pipe.
emojis = "0.9"
# Kit's Markdown parser, used to auto-link Jira keys only in prose.
markdown = "1"
# Native, local-only diagram layout. Keep the supported family surface explicit.
merman = { version = "=0.10.0-alpha.2", default-features = false, features = ["svg", "native-fonts", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er"] }
# Decode/rasterize with host-owned resolvers, never GPUI's default SVG resolver.
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
roxmltree = "0.21"
data-url = "0.3"
http_client = { version = "=0.3.10", package = "gpui-pre-http-client" }
futures = "0.3"
ureq = "2"
sha2 = { workspace = true }
tempfile = "3"
image = { version = "0.25", default-features = false }
serde_json = { workspace = true }
serde = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSValue", "NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "objc2"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVVideoComposition", "block2", "objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }

[dev-dependencies]
base64 = "0.22"
# TestAppContext + the #[gpui::test] harness — app-level behavior tests
# drive the real window/handler chain against a fake facade.
gpui = { package = "gpui-kit", version = "=0.8.1", features = ["test-support"] }
