<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Imaginary Review Forecast</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui; margin: 3rem; }
      .forecast { border: 2px dashed coral; padding: 1rem; }
      .goose { font-size: 4rem; }
    </style>
  </head>
  <body>
    <h1>Today's review forecast</h1>
    <section class="forecast">
      <span class="goose" aria-label="goose">🪿</span>
      <h2>Scattered comments, clearing after lunch</h2>
      <p>Expect occasional suggestions and a 40% chance of unnecessary abstraction.</p>
      <button type="button" onclick="this.textContent = 'Honk received!'">Request a honk</button>
    </section>
    <footer>Entirely fictional. Do not use for navigation.</footer>
  </body>
</html>
